<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>{{script}} - Mbed Simulator</title>
  <link rel="stylesheet" href="/style/simulator.css">
  <link rel="stylesheet" href="/xterm/xterm.css" />

  <!--
    Emulating Mbed OS 5 applications in the browser
    (c) 2017-2018 Arm Ltd. Written by Jan Jongboom.

    Version {{version}}
  -->
</head>
<body class="viewer">
  <div id="viewer-topbar">
    <div id="add-component">+ Add component</div>
    <a id="refresh" href="">&#x21bb;</a>
    <div id="status">Downloading...</div>
  </div>


  <section id="board">
      <div id="virtual-board-notice" class="virtual-board-banner"></div>
      <section id="components">
          <object id="board-svg" data="/{{svgAsset}}" type="image/svg+xml" class="board-{{board}}"></object>
      </section>
  </section>

  <section id="serial">
      <h2>Serial output</h2>
      <div id="serial-toolbar">
          <button type="button" id="btn-clear">Clear</button>
          <button type="button" id="btn-download-log">Download log</button>
          <button type="button" id="btn-copy">Copy</button>
      </div>
      <div id="output"></div>
  </section>

  <section id="overlay">
    <div id="add-component-modal">
      <h2>Add component</h2>
      <select id="select-component">
      </select>
      <div>
        <p>Pins to use</p>
        <div id="pins"></div>
      </div>
      <button id="add-component-btn">Add component</button>
    </div>
  </section>

  <!--
    Viewer configuration: the board drawing to use, the peripheral list and the
    board-notice state.

    It is embedded as JSON, never as a JS string literal. hbs' HTML escaping is
    not JS-string escaping: it does not touch backslash, so the old form - a
    query value interpolated into an inline script as a JS string, e.g.
    `window.requestedBoard = "<the requestedBoard value>"` - let a `\u003c`
    through and the JS parser decoded it back into markup. The value below is
    escaped for both contexts by the server (jsonForScript in
    server/launch-server.js), which is why it is rendered with the triple-stash:
    it is already encoded, and hbs must not re-encode it.
  -->
  <script id="viewer-config" type="application/json">{{{viewerConfig}}}</script>
  <script>
    (function() {
      var config = {};
      try {
        config = JSON.parse(document.getElementById('viewer-config').textContent) || {};
      }
      catch (ex) {
        // Served without the server (the template was not substituted), so
        // there is no configuration: board.js falls back to ?board=.
        config = {};
      }

      window.peripheralsToLoad = config.peripherals || [];
      window.activeBoard = config.board || null;
      window.boardName = config.boardName || null;
      window.boardFallback = config.boardFallback === true;
      window.boardMismatch = config.boardMismatch === true;
      window.requestedBoard = config.requestedBoard || null;
    })();
  </script>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/timesync/timesync.js"></script>
  <script src="/xterm/xterm.js"></script>

  <!-- Required parts of the JS HAL -->
  <script type="text/javascript" src="/js-ui/ga.js"></script>
  <script type="text/javascript" src="/js-ui/init.js"></script>
  <script type="text/javascript" src="/js-hal/EventEmitter.js"></script>
  <script type="text/javascript" src="/js-hal/pinnames.js"></script>
  <script type="text/javascript" src="/js-hal/gpio.js"></script>
  <script type="text/javascript" src="/js-hal/timers.js"></script>
  <script type="text/javascript" src="/js-hal/filehandle.js"></script>
  <script type="text/javascript" src="/js-hal/network.js"></script>
  <script type="text/javascript" src="/js-hal/lora.js"></script>
  <script type="text/javascript" src="/js-hal/blockdevice.js"></script>
  {{#each jshal}}
  <script type="text/javascript" src="{{script}}"></script>
  {{/each}}

  <!-- UI handling -->
  <script type="text/javascript" src="/js-ui/board.js"></script>
  <script type="text/javascript" src="/js-ui/components/base_component.js"></script>
  <script type="text/javascript" src="/js-ui/components/led.js"></script>
  <script type="text/javascript" src="/js-ui/components/push_button.js"></script>
  <script type="text/javascript" src="/js-ui/components/switch.js"></script>
  <script type="text/javascript" src="/js-ui/components/potentiometer.js"></script>
  <script type="text/javascript" src="/js-ui/components/pwm_speaker.js"></script>
  {{#each jsui}}
  <script type="text/javascript" src="{{script}}"></script>
  {{/each}}
  <script type="text/javascript" src="/js-ui/viewer.js"></script>

  <!-- User application -->
  <script async type="text/javascript" src="/out/{{script}}.js"></script>
</body>
</html>
