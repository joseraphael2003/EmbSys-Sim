name: CI

on:
  push:
    branches:
      - modernization-plan1
      - master
  pull_request:
    branches:
      - master

jobs:
  ci:
    name: Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        run: docker build -t mbed-simulator .

      - name: Run golden demo suite
        run: docker run --rm -v ${{ github.workspace }}/out:/app/out mbed-simulator npm run build-demos

      - name: Run headless smoke scenario
        run: docker run --rm -v ${{ github.workspace }}/out:/app/out mbed-simulator node cli.js -i demos/blinky -o out --skip-build --launch-headless --scenario scenarios/blinky.json

      - name: Upload out/ artifact
        uses: actions/upload-artifact@v4
        with:
          name: simulator-out
          path: out/