name: CI

on:
  push:
    branches:
      - modernization-plan1
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        run: docker build -t mbed-simulator .

  smoke:
    name: Golden demo suite + headless smoke
    runs-on: ubuntu-latest
    needs: build
    container:
      image: mbed-simulator
    steps:
      - name: Build all demos (golden suite)
        run: npm run build-demos

      - name: Headless blinky scenario
        run: node cli.js -i demos/blinky -o out --skip-build --launch-headless --scenario scenarios/blinky.json

      - name: Upload out/ artifact
        uses: actions/upload-artifact@v4
        with:
          name: simulator-out
          path: out/